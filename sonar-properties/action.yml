name: "Sonar Properties"
description: "Updates Sonar scan properties with branch context and coverage info"

inputs:
  coverage-artifact:
    description: 'Name of artifact containing coverage info'
    required: false
  extract-dir:
    description: 'Directory to extract the coverage artifact to'
    required: false
  github-token:
    description: 'GitHub token with access to post PR comments'
    default: ${{ github.token }}
    required: false

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: curl -L https://unpkg.com/java-properties/dist-src/index.js -o scripts/java-properties.js
    - name: Download coverage artifact
      if: inputs.coverage-artifact != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh run download "${{ github.event.workflow_run.id || github.run_id }}" \
          --repo "${{ github.repository }}" \
          --name "${{ inputs.coverage-artifact }}" \
          --dir "${{ inputs.extract-dir || github.workspace }}"
    - uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
            const script = require("${{ github.action_path }}/scripts/configure-sonar.js");
            await script({ github, context, core, require });
